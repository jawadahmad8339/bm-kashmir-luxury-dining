<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Rich Royal Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4E1A22" />
      <stop offset="65%" stop-color="#2D0B10" />
      <stop offset="100%" stop-color="#180407" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BD" />
      <stop offset="25%" stop-color="#E2B755" />
      <stop offset="50%" stop-color="#C29331" />
      <stop offset="75%" stop-color="#FCE592" />
      <stop offset="100%" stop-color="#9E6E16" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29331" />
      <stop offset="50%" stop-color="#FFF5C7" />
      <stop offset="100%" stop-color="#D4A43D" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="120" cy="120" r="114" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2.5" opacity="0.8" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5" />

  <!-- Outer Filigree Floral Pips (12 Royal Stars) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <circle cx="120" cy="11" r="2.5" />
    <circle cx="174" cy="25" r="2" />
    <circle cx="215" cy="66" r="2" />
    <circle cx="229" cy="120" r="2.5" />
    <circle cx="215" cy="174" r="2" />
    <circle cx="174" cy="215" r="2" />
    <circle cx="120" cy="229" r="2.5" />
    <circle cx="66" cy="215" r="2" />
    <circle cx="25" cy="174" r="2" />
    <circle cx="11" cy="120" r="2.5" />
    <circle cx="25" cy="66" r="2" />
    <circle cx="66" cy="25" r="2" />
  </g>

  <!-- Royal Kashmiri Chinar Leaf Wreath (Left & Right) -->
  <!-- Left Chinar Branch -->
  <path d="M 46,145 C 42,125 45,98 62,80 C 58,89 59,101 68,107 C 62,94 69,82 78,74 C 77,84 81,93 90,98 C 84,86 89,73 98,68 C 96,78 100,85 107,90" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  <!-- Right Chinar Branch -->
  <path d="M 194,145 C 198,125 195,98 178,80 C 182,89 181,101 172,107 C 178,94 171,82 162,74 C 163,84 159,93 150,98 C 156,86 151,73 142,68 C 144,78 140,85 133,90" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Traditional Kashmiri Samovar Crest Silhouette (Top Center) -->
  <g transform="translate(120, 52) scale(0.68)" filter="url(#goldGlow)">
    <!-- Finial & Crown -->
    <path d="M 0,-34 L 2.5,-30 L -2.5,-30 Z" fill="url(#goldLight)" />
    <circle cx="0" cy="-35" r="2" fill="url(#goldLight)" />
    <!-- Lid Dome -->
    <path d="M -14,-22 C -14,-28 14,-28 14,-22 L 11,-18 L -11,-18 Z" fill="url(#goldGrad)" />
    <!-- Neck -->
    <rect x="-7" y="-18" width="14" height="6" fill="url(#goldGrad)" />
    <!-- Urn Body with Kashmiri engravings -->
    <path d="M -18,-12 C -24,2 -22,14 -12,22 L 12,22 C 22,14 24,2 18,-12 Z" fill="url(#goldGrad)" stroke="#2D0B10" stroke-width="0.7" />
    <!-- Handles -->
    <path d="M -18,-6 C -28,-6 -28,8 -17,12" fill="none" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round" />
    <path d="M 18,-6 C 28,-6 28,8 17,12" fill="none" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round" />
    <!-- Spigot Tap -->
    <path d="M 0,16 L 0,26 L 4,26" fill="none" stroke="url(#goldLight)" stroke-width="1.8" />
    <!-- Pedestal Base -->
    <path d="M -10,22 L -14,30 L 14,30 L 10,22 Z" fill="url(#goldGrad)" />
    <!-- Rising Aromatic Steam Spirals -->
    <path d="M -4,-38 C -7,-44 0,-47 -3,-52" fill="none" stroke="url(#goldLight)" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 3,-38 C 0,-44 7,-47 4,-52" fill="none" stroke="url(#goldLight)" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Imperial "BM" Monogram -->
  <g text-anchor="middle">
    <!-- Drop Shadow / Glow -->
    <text x="120" y="126" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="3" 
          fill="#120305" 
          opacity="0.8">BM</text>
    <text x="120" y="124" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="3" 
          fill="url(#goldLight)">BM</text>
  </g>

  <!-- Crown / Star above BM -->
  <g transform="translate(120, 80) scale(0.8)" fill="url(#goldLight)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" />
    <circle cx="-14" cy="1" r="1.5" />
    <circle cx="14" cy="1" r="1.5" />
  </g>

  <!-- Banner Ribbon for "KASHMIR" -->
  <g transform="translate(0, 10)">
    <!-- Ribbon Shadow -->
    <path d="M 38,154 L 54,142 L 58,154 L 182,154 L 186,142 L 202,154 L 194,172 L 182,166 L 58,166 L 46,172 Z" fill="#120305" opacity="0.6" />
    <!-- Main Ribbon Plaque -->
    <path d="M 48,152 C 84,146 156,146 192,152 L 184,170 C 152,165 88,165 56,170 Z" 
          fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Ribbon Ends Folded -->
    <polygon points="48,152 36,162 48,172 56,170" fill="url(#goldGrad)" opacity="0.85" />
    <polygon points="192,152 204,162 192,172 184,170" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- "KASHMIR" Text -->
    <text x="120" y="164.5" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Cinzel', 'Trajan Pro', 'Montserrat', sans-serif" 
          font-size="13.5" 
          font-weight="800" 
          letter-spacing="6" 
          fill="url(#goldLight)">KASHMIR</text>
  </g>

  <!-- Subtitle Ribbon: "ROYAL DINING" -->
  <text x="120" y="194" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="8.5" 
        font-weight="700" 
        letter-spacing="3" 
        fill="url(#goldGrad)" 
        opacity="0.95">ROYAL DINING • 24/7</text>

  <!-- Subtle Est. / Lahore dots -->
  <circle cx="68" cy="191" r="1.5" fill="url(#goldLight)" opacity="0.7" />
  <circle cx="172" cy="191" r="1.5" fill="url(#goldLight)" opacity="0.7" />

  <!-- Bottom Arch Laurel Notch -->
  <path d="M 105,206 Q 120,212 135,206" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="120" cy="209" r="1.8" fill="url(#goldLight)" />
</svg>
